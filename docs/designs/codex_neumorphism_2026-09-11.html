<header><small>小懂哥 · v2.7.1 设计改造</small><h1>让阅读舒展，让操作有触感。</h1><p>沿用墨绿、暖纸与黑胶。正文保持平整，按钮轻轻浮起，输入框与选中导航浅浅凹入。以下为实际应用截图，全部使用模拟记录。</p><p>390px 手机视口：正文左右各约 27px；小屏至少 26px。保留三档字号、深浅阅读、原文换行和现有操作。</p><nav aria-label="预览页面"><a href="#reading">阅读</a><a href="#home">首页</a><a href="#editor">编辑</a><a href="#yearbook">回顾</a><a href="#create">新建</a></nav></header>
