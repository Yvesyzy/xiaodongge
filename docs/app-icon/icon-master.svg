<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3029"/>
      <stop offset="1" stop-color="#17483e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>

  <!-- deep-green gradient background, echoing the app header -->
  <rect width="108" height="108" fill="url(#bg)"/>
  <rect width="108" height="108" fill="url(#vignette)"/>

  <!-- ===== vinyl record ===== -->
  <g id="record">
    <!-- disc -->
    <circle cx="54" cy="54" r="31" fill="#fffdf8"/>
    <circle cx="54" cy="54" r="31" fill="none" stroke="#0b3029" stroke-opacity="0.22" stroke-width="1.4"/>
    <!-- grooves -->
    <circle cx="54" cy="54" r="29.4" fill="none" stroke="#071f1b" stroke-opacity="0.10" stroke-width="0.8"/>
    <circle cx="54" cy="54" r="28.0" fill="none" stroke="#071f1b" stroke-opacity="0.12" stroke-width="0.7"/>
    <circle cx="54" cy="54" r="26.6" fill="none" stroke="#071f1b" stroke-opacity="0.12" stroke-width="0.7"/>
    <circle cx="54" cy="54" r="25.2" fill="none" stroke="#071f1b" stroke-opacity="0.10" stroke-width="0.7"/>
    <circle cx="54" cy="54" r="23.8" fill="none" stroke="#071f1b" stroke-opacity="0.08" stroke-width="0.7"/>
    <!-- lead-out band -->
    <circle cx="54" cy="54" r="22.0" fill="none" stroke="#071f1b" stroke-opacity="0.16" stroke-width="1.1"/>
    <!-- sheen -->
    <path d="M30.2,45.0 A25.7,25.7 0 0 1 47.3,29.2" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.2" stroke-linecap="round"/>
    <!-- center label -->
    <circle cx="54" cy="54" r="11.8" fill="#c9973f"/>
    <circle cx="54" cy="54" r="11.8" fill="none" stroke="#0b3029" stroke-opacity="0.25" stroke-width="1.0"/>
    <circle cx="54" cy="54" r="8.4" fill="none" stroke="#fffdf8" stroke-opacity="0.9" stroke-width="1.1"/>
    <!-- music note -->
    <g transform="translate(54,54)" fill="#fffdf8">
      <ellipse cx="-3.1" cy="3.0" rx="3.3" ry="2.5" transform="rotate(-18 -3.1 3.0)"/>
      <path d="M0.3,0.6 L0.3,-11.2" stroke="#fffdf8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M0.3,-11.2 C4.7,-9.5 6.5,-5.5 5.9,-1.7 C5.1,-4.3 3.2,-6.9 0.3,-8.0 Z"/>
    </g>
  </g>
</svg>
