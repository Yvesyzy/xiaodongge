name: Release Android test APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run release checks
        run: |
          npm run typecheck
          npm run mobile:check:v219
          npm run check:v1-reliability

      - name: Build and sync mobile app
        run: |
          npm run mobile:build
          npm run android:sync

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and name APK
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/xiaodongge-${GITHUB_REF_NAME}-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/xiaodongge-${GITHUB_REF_NAME}-debug.apk"
          package_line=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "release/xiaodongge-${GITHUB_REF_NAME}-debug.apk" | head -n 1)
          [[ "$package_line" == *"name='com.yves.musicarchive'"* ]]
          [[ "$package_line" == *"versionCode='12'"* ]]
          [[ "$package_line" == *"versionName='2.1.9'"* ]]
          sha256sum "release/xiaodongge-${GITHUB_REF_NAME}-debug.apk" > "release/xiaodongge-${GITHUB_REF_NAME}-debug.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "小懂哥 $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "小懂哥 $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          fi
